<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자료공유</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="자료공유" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.min.js"
          integrity="sha384-sgcvElP/LlNRtORGYFLO/9K/bENcpJK19HgvqslWXog6d8f/Va4TpltGiBlGntCM" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"
          integrity="sha384-odPBjvtXVM/5hOYIr3A1dB+flh0c3wAT3bSesIOqEGmyUA4JoKf/YTWy0XKOYAY7" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"
          integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
          integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
</head>
<body>
  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="" />
  </div>

  <!-- 계정 모달 -->
  <div class="email-modal" id="emailModal">
    <div class="email-box">
      <h3>내 계정</h3>
      <p class="email-modal-desc">로그인된 계정입니다.</p>
      <p class="account-email" id="accountEmail"></p>
      <div class="email-actions">
        <button class="danger" id="logoutBtn">로그아웃</button>
        <button class="secondary" id="accountCancelBtn">닫기</button>
      </div>
    </div>
  </div>

  <!-- 합치기 모달 -->
  <div class="merge-modal" id="mergeModal">
    <div class="merge-box">
      <h3>게시물 합치기</h3>
      <p class="merge-modal-desc" id="mergeModalDesc">선택한 항목을 하나의 게시물로 합칩니다.</p>
      <label for="mergeTitleInput">새 제목</label>
      <input id="mergeTitleInput" type="text" placeholder="합친 게시물 제목" />
      <div class="merge-actions">
        <button type="button" id="mergeConfirmBtn">합치기</button>
        <button type="button" class="secondary" id="mergeCancelBtn">취소</button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div class="edit-modal" id="editModal">
    <div class="edit-box">
      <h3 id="editModalHeading">자료 수정</h3>
      <div id="editTextFields">
        <label for="editTitleInput">제목</label>
        <input id="editTitleInput" type="text" placeholder="제목" />
        <label for="editContentInput">내용</label>
        <textarea id="editContentInput" placeholder="공유할 내용"></textarea>
      </div>
      <div id="editFileFields" hidden>
        <p class="edit-file-current" id="editFileCurrent"></p>
        <label class="edit-file-pick" for="editFileInput">
          <span id="editFilePickLabel">새 파일 선택</span>
          <input id="editFileInput" type="file" />
        </label>
      </div>
      <div class="edit-actions">
        <button type="button" id="editSaveBtn">저장</button>
        <button type="button" class="secondary" id="editCancelBtn">취소</button>
      </div>
    </div>
  </div>

  <!-- QR 모달 -->
  <div class="qr-modal" id="qrModal">
    <div class="qr-box">
      <div id="qrCanvas"></div>
      <p id="qrLabel"></p>
      <button class="secondary qr-close" id="qrClose">닫기</button>
    </div>
  </div>

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand">
        <span class="login-icon">📤</span>
        <h1>자료공유</h1>
        <p>파일과 텍스트를 드래그앤드롭으로<br>빠르게 공유합니다</p>
      </div>
      <div class="login-form-wrap">
        <label for="loginEmailInput">이메일</label>
        <input id="loginEmailInput" type="email" placeholder="you@example.com" autocomplete="email" />
        <label for="loginPasswordInput">비밀번호</label>
        <input id="loginPasswordInput" type="password" placeholder="6자 이상" autocomplete="current-password" />
        <p class="login-error" id="loginError"></p>
        <button id="loginBtn">로그인</button>
        <button class="secondary" id="signupBtn">회원가입</button>
      </div>
      <p class="login-notice">처음이면 회원가입 후 인증 메일의 링크를 눌러주세요.<br>인증이 끝나면 자동으로 로그인됩니다.</p>
    </div>
  </div>

  <main class="app" hidden>
    <header>
      <div class="brand">
        <h1>자료공유</h1>
        <p>파일과 텍스트를 드래그앤드롭으로 빠르게 공유합니다.</p>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="profileBtn" title="이메일 설정">👤</button>
        <button class="icon-btn" id="themeBtn" title="다크모드 전환">🌙</button>
        <div class="badge" id="statusBadge">Supabase 연결 대기</div>
      </div>
    </header>

    <section class="grid">
      <!-- 새 게시물 (통합 작성기) -->
      <div class="card full composer" id="composerCard">
        <h2>새 게시물</h2>
        <input id="composerTitle" class="title-input" type="text" placeholder="제목 (선택 사항)" />
        <textarea id="composerText" rows="3"
          placeholder="내용을 입력하거나, 파일을 여기로 끌어다 놓기 · Ctrl+V 붙여넣기 가능 · 마크다운 지원"></textarea>
        <ul class="file-queue" id="fileQueue" hidden></ul>
        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="composer-row">
          <label class="attach-btn" title="파일 첨부">
            📎<input id="fileInput" type="file" multiple hidden />
          </label>
          <label class="attach-btn" title="카메라 촬영">
            📷<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
          </label>
          <span class="expiry-row">만료:
            <select id="postExpiry">
              <option value="">없음</option>
              <option value="60">1시간</option>
              <option value="1440">24시간</option>
              <option value="10080">7일</option>
            </select>
          </span>
          <span class="composer-spacer"></span>
          <button id="sharePostBtn">공유</button>
          <button class="secondary" id="clearPostBtn">비우기</button>
        </div>
      </div>

      <!-- 공유된 자료 목록 -->
      <div class="card full">
        <div class="toolbar">
          <div class="toolbar-left">
            <h2 style="margin:0">공유된 자료</h2>
            <input type="search" id="searchInput" placeholder="검색…" />
          </div>
          <div class="toolbar-right">
            <select class="sort-select" id="sortSelect">
              <option value="newest">최신순</option>
              <option value="oldest">오래된순</option>
              <option value="size">크기순</option>
            </select>
            <button class="secondary" id="multiCancelBtn">선택 취소</button>
            <button class="secondary" id="multiMergeBtn">합치기</button>
            <button class="danger" id="multiDeleteBtn">선택 삭제</button>
          </div>
        </div>
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-filter="all">전체</button>
          <button class="chip" data-filter="files">📎 파일</button>
          <button class="chip" data-filter="text">📝 텍스트</button>
          <button class="chip" data-filter="image">🖼️ 이미지</button>
        </div>
        <div class="suggest-bar" id="suggestBar" hidden></div>
        <div class="list" id="shareList"></div>
        <button class="secondary load-more" id="loadMoreBtn" hidden>더 보기</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
